/* ---------- Pontuação ---------- */
const num = v => typeof v === "number";
const sectionById = id => SECTIONS.find(s => s.id === id);
const isComplete = (id, a) => Array.isArray(a) && sectionById(id).items.every((_, i) => num(a[i]));
const mean = arr => arr.length ? arr.reduce((x, y) => x + y, 0) / arr.length : 0;

function scoreAQ(a) {
  const pts = a.map((v, i) => {
    const agree = v <= 1;
    return AQ_AGREE.has(i + 1) ? (agree ? 1 : 0) : (agree ? 0 : 1);
  });
  const total = pts.reduce((x, y) => x + y, 0);
  const subs = Object.fromEntries(Object.entries(AQ_SUBSCALES).map(([k, items]) => [k, items.reduce((s, n) => s + pts[n - 1], 0)]));
  const level = total >= 32 ? "alert" : total >= 26 ? "warn" : "ok";
  return { total, subs, level };
}

function scoreRAADS(a) {
  let total = 0, now = 0, child = 0;
  sectionById("raads14").items.forEach((it, i) => {
    const v = 3 - a[i];
    total += it.rev ? 3 - v : v;
    // Padrão temporal: respostas "agora e na infância" (0) ou "só antes dos 16" (2) indicam presença na infância
    const ans = it.rev ? null : a[i];
    if (ans === 0 || ans === 2) child++;
    if (ans === 0 || ans === 1) now++;
  });
  return { total, now, child, level: total >= 14 ? "alert" : total >= 10 ? "warn" : "ok" };
}

const CRITERIA = {
  A1: "Reciprocidade socioemocional",
  A2: "Comunicação não verbal",
  A3: "Relacionamentos",
  B1: "Movimentos, fala ou uso de objetos repetitivos",
  B2: "Rotinas e inflexibilidade",
  B3: "Interesses restritos e intensos",
  B4: "Diferenças sensoriais"
};

function scoreDSM(a) {
  const items = sectionById("dsm").items;
  const crit = {};
  Object.keys(CRITERIA).forEach(c => {
    const vals = items.map((it, i) => it.c === c ? a[i] : null).filter(num);
    const m = mean(vals);
    const max = Math.max(...vals);
    // presente: média em "Frequentemente" ou mais, ou ao menos uma resposta "Sempre" com média em "Às vezes" ou mais
    const status = (m >= 2.67 || (max === 4 && m >= 2)) ? "present" : m >= 1.67 ? "partial" : "absent";
    crit[c] = { mean: m, status };
  });
  const onsetIdx = items.findIndex(it => it.key === "onset");
  const noticedIdx = items.findIndex(it => it.key === "noticed");
  const A = ["A1", "A2", "A3"], B = ["B1", "B2", "B3", "B4"];
  const aPresent = A.filter(c => crit[c].status === "present").length;
  const aPartial = A.filter(c => crit[c].status !== "absent").length;
  const bPresent = B.filter(c => crit[c].status === "present").length;
  const bPartial = B.filter(c => crit[c].status !== "absent").length;
  const onset = a[onsetIdx];           // 0 certeza, 1 provável, 2 não sei, 3 não
  const noticed = a[noticedIdx];
  const childhood = onset <= 1;
  const full = aPresent === 3 && bPresent >= 2;
  const near = !full && aPartial === 3 && bPartial >= 2;
  return { crit, aPresent, bPresent, aPartial, bPartial, onset, noticed, childhood, full, near,
    level: full && childhood ? "alert" : (full || near) ? "warn" : "ok" };
}

function scoreCamuf(a) {
  const total = a.reduce((x, y) => x + y, 0); // 0–32
  return { total, max: 32, level: total >= 22 ? "alert" : total >= 14 ? "warn" : "ok" };
}

// Nível indicativo de suporte (DSM-5-TR): 0 = sem necessidade relevante, 1, 2, 3
function toLevel(m) { return m >= 2.3 ? 3 : m >= 1.5 ? 2 : m >= 0.5 ? 1 : 0; }

function scoreSupport(a) {
  const items = sectionById("suporte").items;
  const sVals = [], rVals = [];
  let speech = 0, crises = 0;
  items.forEach((it, i) => {
    if (it.key === "speech") speech = a[i];
    else if (it.key === "crises") crises = a[i];
    else (it.d === "S" ? sVals : rVals).push(a[i]);
  });
  const sMean = mean(sVals), rMean = mean(rVals);
  // A fala entra pelos exemplos do DSM-5-TR: frases simples ~ nível 2; poucas palavras ~ nível 3
  const speechLevel = speech === 2 ? 3 : speech === 1 ? 2 : 0;
  const social = Math.max(toLevel(sMean), speechLevel);
  // Crises semanais indicam, no mínimo, nível 1 em comportamentos restritos
  const restricted = crises >= 3 ? Math.max(1, toLevel(rMean)) : toLevel(rMean);
  return { sMean, rMean, speech, crises, social, restricted };
}

function scoreDif(a) {
  const items = sectionById("dif").items;
  const out = {};
  items.forEach((it, i) => { out[it.key] = a[i]; }); // 0 sim, 1 em parte, 2 não
  return out;
}

function contextOf(a) {
  if (!Array.isArray(a)) return {};
  const items = sectionById("contexto").items;
  const o = {};
  items.forEach((it, i) => { o[it.key] = a[i]; });
  return o;
}

function overall(R) {
  // Cada fonte soma pontos de evidência; o total máximo é 7.
  let pts = 0;
  const reasons = [];
  if (R.aq50) {
    if (R.aq50.total >= 32) { pts += 2; reasons.push(`AQ-50 em ${R.aq50.total}, acima do corte de pesquisa (32)`); }
    else if (R.aq50.total >= 26) { pts += 1; reasons.push(`AQ-50 em ${R.aq50.total}, acima do corte clínico (26)`); }
  }
  if (R.raads14 && R.raads14.total >= 14) { pts += 1; reasons.push(`RAADS-14 em ${R.raads14.total}, acima do corte (14)`); }
  if (R.dsm) {
    if (R.dsm.full) { pts += 2; reasons.push("respostas compatíveis com os 3 critérios sociais (A) e ao menos 2 dos 4 comportamentais (B) do DSM-5-TR"); }
    else if (R.dsm.near) { pts += 1; reasons.push("critérios do DSM-5-TR presentes de forma parcial"); }
    if (R.dsm.childhood && (R.dsm.full || R.dsm.near)) { pts += 1; reasons.push("características presentes desde a infância"); }
  }
  if (R.camuf && R.camuf.total >= 22 && pts >= 2) { pts += 1; reasons.push("camuflagem social alta, que costuma reduzir as pontuações dos questionários"); }
  const enough = R.aq50 && R.raads14 && R.dsm;
  let cat;
  if (pts >= 5 && (!R.dsm || R.dsm.childhood)) cat = { level: "alert", label: "Alta compatibilidade com autismo", text: "Vários instrumentos independentes apontam na mesma direção, e as características parecem presentes desde a infância. Esse é o perfil em que uma avaliação diagnóstica especializada é fortemente recomendada." };
  else if (pts >= 3) cat = { level: "warn", label: "Compatibilidade moderada", text: "Há sinais consistentes em parte dos instrumentos. Isso pode indicar autismo com camuflagem, traços autistas sem diagnóstico completo, ou outra condição com sinais parecidos. Uma avaliação ajuda a esclarecer." };
  else if (pts >= 1) cat = { level: "warn", label: "Sinais isolados", text: "Apareceram alguns sinais, mas não um padrão consistente entre os instrumentos. Traços autistas isolados são comuns na população geral." };
  else cat = { level: "ok", label: "Baixa compatibilidade", text: "Os instrumentos ficaram abaixo dos pontos de corte. Se você ainda sente que se encaixa no espectro, especialmente se camufla muito, uma conversa com um especialista continua válida." };
  return { pts, reasons, cat, enough };
}

/* ---------- Estado ---------- */
const STORE_KEY = "avaliacao-autismo-v1";
let state = { answers: {}, queue: [], view: "home", sec: null, idx: 0 };
try { const raw = localStorage.getItem(STORE_KEY); if (raw) state.answers = JSON.parse(raw).answers || {}; } catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ answers: state.answers })); } catch (e) {} }

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const done = id => isComplete(id, state.answers[id]);
const totalItems = SECTIONS.reduce((s, x) => s + x.items.length, 0);

function computeAll() {
  const R = {};
  if (done("aq50")) R.aq50 = scoreAQ(state.answers.aq50);
  if (done("raads14")) R.raads14 = scoreRAADS(state.answers.raads14);
  if (done("dsm")) R.dsm = scoreDSM(state.answers.dsm);
  if (done("camuf")) R.camuf = scoreCamuf(state.answers.camuf);
  if (done("suporte")) R.suporte = scoreSupport(state.answers.suporte);
  if (done("dif")) R.dif = scoreDif(state.answers.dif);
  R.ctx = contextOf(state.answers.contexto);
  return R;
}

/* ---------- Telas ---------- */

            </div>
            <button class="btn sm ${done(s.id) ? "ghost" : ""}" data-start="${s.id}">${done(s.id) ? "Refazer" : "Fazer"}</button>

  app.querySelector("#startAll").onclick = () => {

  };

function startQueue(ids) { state.queue = ids.slice(); nextSection(); }

// Abre a próxima etapa da fila, retomando na primeira pergunta sem resposta.
function nextSection() {
  state.sec = state.queue.shift();
  const sec = sectionById(state.sec);
  let a = state.answers[sec.id];
  if (!Array.isArray(a)) a = state.answers[sec.id] = [];
  let i = 0;
  while (i < sec.items.length - 1 && num(a[i])) i++;
  state.idx = i;
  go("quiz");
}

function go(view) { state.view = view; render(); window.scrollTo(0, 0); }

function renderQuiz() {
  const sec = sectionById(state.sec);
  const a = state.answers[sec.id];
  const it = sec.items[state.idx];
  const opts = it.options || sec.options;
  const total = sec.items.length;
  const secNum = SECTIONS.indexOf(sec) + 1;
  const ctx = contextOf(state.answers.contexto);
  const forOther = ctx.who === 1 && ["aq50", "raads14", "dsm", "camuf"].includes(sec.id);
  app.innerHTML = `
    <div class="quiz">
      <div class="qnav">
        <button class="btn ghost sm" id="exit">Salvar e sair</button>
        <span class="count">Etapa ${secNum} de ${SECTIONS.length} · pergunta ${state.idx + 1} de ${total}</span>
      </div>
      <div class="progress" aria-hidden="true"><span style="width:${Math.round((state.idx / total) * 100)}%"></span></div>
      ${state.idx === 0 ? `<div class="instr"><strong>${esc(sec.name)}</strong><br>${esc(sec.instr)}${forOther ? "<br><em>Você está respondendo por outra pessoa: leia as frases como se fossem sobre ela.</em>" : ""}</div>` : ""}
      ${it.c && CRITERIA[it.c] ? `<span class="eyebrow">Critério ${it.c} · ${esc(CRITERIA[it.c])}</span>` : ""}
      <p class="question" id="q">${sec.prefix && !it.noPrefix ? `<span class="prefix">${esc(sec.prefix)}</span>` : ""}${esc(it.t)}</p>
      <div class="options" role="group" aria-labelledby="q">
        ${opts.map((o, i) => `<button class="opt" data-v="${i}" aria-pressed="${a[state.idx] === i}"><kbd>${i + 1}</kbd><span>${esc(o)}</span></button>`).join("")}
      </div>
      <div class="qnav">
        <button class="btn ghost sm" id="back" ${state.idx === 0 ? "disabled" : ""}>Voltar</button>
        <span class="count">Teclas 1–${opts.length}</span>
      </div>
    </div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(+b.dataset.v));
  app.querySelector("#back").onclick = () => { if (state.idx > 0) { state.idx--; render(); } };
  app.querySelector("#exit").onclick = () => { save(); go("home"); };
}

function choose(v) {
  const sec = sectionById(state.sec);
  state.answers[sec.id][state.idx] = v;
  save();
  app.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-pressed", +b.dataset.v === v));
  setTimeout(() => {
    if (state.idx < sec.items.length - 1) { state.idx++; render(); return; }
    if (state.queue.length) nextSection();
    else go("results");
  }, 160);
}

document.addEventListener("keydown", e => {
  if (state.view !== "quiz" || e.altKey || e.ctrlKey || e.metaKey) return;
  const sec = sectionById(state.sec);
  const opts = sec.items[state.idx].options || sec.options;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= opts.length) choose(n - 1);
  else if (e.key === "Backspace" && state.idx > 0) { state.idx--; render(); }
});

/* ---------- Resultado ---------- */
function meter(score, max, cuts, label, thin) {
  const p = v => (v / max) * 100;
  return `<div class="meter">
    <div class="lbl"><span>${label}</span><span>${score} / ${max}</span></div>
    <div class="track${thin ? " thin" : ""}" role="img" aria-label="${label}: ${score} de ${max}">
      <div class="fill" style="width:${p(score)}%"></div>
      ${cuts.map(c => `<div class="cut" style="left:calc(${p(c.v)}% - 1px)"><span>${c.l}</span></div>`).join("")}
    </div></div>`;
}

  const verdict = `
    <div class="verdict ${O.cat.level}">

      <span class="big">${O.cat.label}</span>
      <p>${O.cat.text}</p>
      ${O.reasons.length ? `<p class="small"><strong>Pesou para este resultado:</strong> ${O.reasons.join("; ")}.</p>` : ""}
      ${missing.length ? `<p class="small muted">Etapas não concluídas: ${missing.join(", ")}. O resultado fica mais preciso com todas as etapas.</p>` : ""}
    </div>`;

  const warnings = [];
  if (young) warnings.push("A pessoa avaliada tem menos de 16 anos. AQ-50 e RAADS-14 foram validados em adultos; para crianças e adolescentes existem versões próprias (como o M-CHAT-R/F até 30 meses e o AQ infantil e adolescente). Leve os resultados como orientação geral e procure neuropediatra ou psiquiatra da infância.");
  if (ctx.who === 1) warnings.push("Você respondeu por outra pessoa. AQ-50 e RAADS-14 são de autorrelato, então os números são aproximados. Para níveis 2 e 3, a avaliação clínica normalmente se baseia justamente no relato da família e na observação direta.");
  if (female && R.aq50) warnings.push("Mulheres autistas costumam pontuar menos no AQ que homens autistas e são diagnosticadas mais tarde, muitas vezes por causa da camuflagem. Considere os resultados junto com a etapa de camuflagem.");

  const aqBlock = R.aq50 ? `
    <article class="result">
      <div class="result-head"><h3>AQ-50: Quociente do Espectro Autista</h3><span class="chip ${R.aq50.level}">${R.aq50.total >= 32 ? "Acima do corte 32" : R.aq50.total >= 26 ? "Acima do corte 26" : "Abaixo dos cortes"}</span></div>
      ${meter(R.aq50.total, 50, [{ v: 26, l: "26" }, { v: 32, l: "32" }], "Pontuação total")}
      <p>${R.aq50.total >= 32
        ? "No estudo original, 80% dos adultos autistas tiveram 32 ou mais, contra 2% da população geral."
        : R.aq50.total >= 26
          ? "Acima de 26, o ponto de corte usado em clínicas para indicar avaliação (sensibilidade de 95% em adultos encaminhados), mas abaixo de 32, que tem menos falsos positivos."
          : "Abaixo do ponto de corte clínico de 26. Na população geral, a média fica em torno de 16 a 17 pontos."}</p>
      <p class="small muted">Referências: média de adultos autistas no estudo original 35,8; média da população geral 16,4.</p>
      <div class="stack">
        <span class="eyebrow">Subescalas (0 a 10 cada)</span>
        ${Object.entries(R.aq50.subs).map(([k, v]) => meter(v, 10, [], k, true)).join("")}
        <p class="small muted">Em pessoas autistas, as subescalas mais elevadas costumam ser habilidade social, comunicação e alternância de atenção. Atenção a detalhes alta isoladamente é comum em pessoas não autistas.</p>
      </div>
    </article>` : "";

  const raadsBlock = R.raads14 ? `
    <article class="result">
      <div class="result-head"><h3>RAADS-14 Screen</h3><span class="chip ${R.raads14.level}">${R.raads14.total >= 14 ? "Acima do corte 14" : "Abaixo do corte"}</span></div>
      ${meter(R.raads14.total, 42, [{ v: 14, l: "14" }], "Pontuação total")}
      <p>Medianas no estudo de validação: adultos autistas 32, adultos com TDAH 15, outras condições psiquiátricas 11, pessoas sem condição psiquiátrica 3.</p>
      <p class="small">Você marcou ${R.raads14.child} de 13 características como presentes na infância. ${R.raads14.child >= 7 ? "Isso reforça um padrão de desenvolvimento, que é exigido para o diagnóstico." : R.raads14.now > R.raads14.child + 4 ? "A maioria aparece só hoje. Características que surgem apenas na vida adulta são menos típicas de autismo e podem ter outras causas (ansiedade, depressão, esgotamento)." : ""}</p>
    </article>` : "";

  const dsmBlock = R.dsm ? `
    <article class="result">
      <div class="result-head"><h3>Critérios do DSM-5-TR</h3><span class="chip ${R.dsm.level}">${R.dsm.full ? "Padrão completo" : R.dsm.near ? "Padrão parcial" : "Padrão incompleto"}</span></div>
      <p>Para o diagnóstico, o DSM-5-TR exige os <strong>3 critérios A</strong> (comunicação social) e <strong>pelo menos 2 dos 4 critérios B</strong> (comportamentos restritos e repetitivos), presentes desde o início do desenvolvimento e causando prejuízo. Suas respostas: <strong>${R.dsm.aPresent} de 3</strong> critérios A e <strong>${R.dsm.bPresent} de 4</strong> critérios B como presentes.</p>
      <div class="crit">
        ${Object.entries(CRITERIA).map(([c, name]) => {
          const s = STATUS[R.dsm.crit[c].status];
          return `<div><span class="code">${c}</span><strong>${name}</strong><span class="chip ${s[1]}">${s[0]}</span></div>`;
        }).join("")}
        <div><span class="code">C</span><strong>Início na infância</strong><span class="chip ${R.dsm.childhood ? "alert" : R.dsm.onset === 2 ? "warn" : "ok"}">${["Sim, com certeza", "Provavelmente", "Não sabe", "Começou depois"][R.dsm.onset]}</span></div>
      </div>
      ${R.dsm.onset === 3 ? `<p class="small">Você indicou que as características começaram na adolescência ou na vida adulta. O autismo é uma condição do neurodesenvolvimento, presente desde a infância, mesmo que só fique visível quando as demandas aumentam. Sinais que surgiram depois merecem investigação de outras causas.</p>` : ""}
      <p class="small muted">Esta etapa organiza as perguntas pelos critérios oficiais, mas não é um instrumento validado. “Presente” significa que suas respostas ficaram na faixa de “Frequentemente” ou mais.</p>
    </article>` : "";

  const camufBlock = R.camuf ? `
    <article class="result">
      <div class="result-head"><h3>Camuflagem social</h3><span class="chip ${R.camuf.level}">${R.camuf.level === "alert" ? "Alta" : R.camuf.level === "warn" ? "Moderada" : "Baixa"}</span></div>
      ${meter(R.camuf.total, 32, [{ v: 14, l: "moderada" }, { v: 22, l: "alta" }], "Pontuação")}
      <p>${R.camuf.level === "alert"
        ? "Você relata muito esforço para parecer socialmente adequado(a). Em pessoas autistas, isso pode esconder as dificuldades dos outros e até dos questionários, e está ligado a exaustão, ansiedade e esgotamento (burnout autista). Conte isso na avaliação."
        : R.camuf.level === "warn" ? "Você relata algum esforço para se adaptar socialmente. Isso é comum em pessoas autistas e também em pessoas com ansiedade social."
        : "Você relata pouco esforço para se adaptar socialmente."}</p>
      <p class="small muted">Perguntas de apoio baseadas nos três componentes da camuflagem descritos na pesquisa (compensação, mascaramento e assimilação). Não é a escala CAT-Q original e não tem ponto de corte validado.</p>
    </article>` : "";

  let supportBlock = "";
  if (R.suporte) {
    const show = O.pts >= 3;
    supportBlock = `
    <section class="stack">
      <h2>Nível de suporte indicativo</h2>
      <p>O DSM-5-TR define o nível de suporte <strong>separadamente</strong> para comunicação social e para comportamentos restritos e repetitivos. Abaixo está a estimativa a partir das suas respostas sobre o dia a dia.</p>
      ${!show ? `<div class="notice"><p>Como o resultado geral não indicou compatibilidade moderada ou alta, os níveis abaixo descrevem apenas a necessidade de apoio no dia a dia, não um nível de autismo.</p></div>` : ""}
      <div class="levels">
        ${[["S", "Comunicação social", R.suporte.social, R.suporte.sMean], ["R", "Comportamentos restritos e repetitivos", R.suporte.restricted, R.suporte.rMean]].map(([d, name, lvl, m]) => `
          <div class="lvl">
            <span class="eyebrow">${name}</span>
            <span class="num">${lvl === 0 ? "–" : lvl}</span>
            <strong>${LEVEL_NAME[lvl]}</strong>
            <p class="small">${LEVEL_DESC[d][lvl]}</p>
            <span class="small muted">Média das respostas: ${m.toFixed(1).replace(".", ",")} de 3</span>
          </div>`).join("")}
      </div>
      ${R.suporte.crises >= 2 ? `<p class="small">Você relatou crises de sobrecarga ${R.suporte.crises === 3 ? "toda semana ou mais" : "algumas vezes por mês"}. Isso é importante para o plano de apoio (ajustes no trabalho ou na escola, terapia ocupacional com foco sensorial, estratégias de regulação).</p>` : ""}
      <p class="small muted"><strong>Atenção:</strong> o nível de suporte só é definido pelo profissional, por observação e entrevista. Ele também pode mudar ao longo da vida e conforme o ambiente. A estimativa usa as descrições oficiais do DSM-5-TR, mas não é um instrumento validado. Em adultos que conseguem responder sozinhos um questionário como este, o nível 1 é o mais comum.</p>
    </section>`;
  }

  let difBlock = "";
  if (R.dif) {
    const D = R.dif, notes = [];
    const pos = v => v === 0, part = v => v === 1;
    if (pos(D.tdah) || part(D.tdah)) notes.push(["TDAH", "TDAH e autismo aparecem juntos em grande parte dos casos (estimativas de 30% a 50% dos autistas têm TDAH). O TDAH também aumenta a pontuação do RAADS-14. Vale investigar os dois na mesma avaliação. Você pode usar o ASRS no rastreio geral."]);
    if (pos(D.socanx) || part(D.socanx)) notes.push(["Ansiedade social", "Se a dificuldade some com pessoas próximas e você entende os outros intuitivamente, o quadro lembra mais ansiedade social do que autismo. No autismo, a dificuldade de entender as regras sociais costuma aparecer mesmo em ambientes seguros. As duas condições também podem coexistir."]);
    if (pos(D.trauma) || part(D.trauma)) notes.push(["Trauma", "Trauma complexo pode causar retraimento social, hipervigilância sensorial e dificuldade de confiar, sinais que se parecem com autismo. A diferença principal é o início: no autismo, as características existem desde a primeira infância, antes dos eventos traumáticos. Pessoas autistas também sofrem mais bullying e trauma."]);
    if (pos(D.toc) || part(D.toc)) notes.push(["TOC", "No TOC, rituais e pensamentos repetitivos causam angústia e servem para aliviar medo. No autismo, rotinas e interesses costumam trazer conforto ou prazer. As duas condições podem coexistir."]);
    if (pos(D.dep) || part(D.dep)) notes.push(["Depressão", "Isolamento que começou junto com tristeza ou desânimo, depois de uma fase em que você gostava de socializar, sugere depressão. Depressão também é muito comum em autistas adultos, principalmente após anos de camuflagem."]);
    if (pos(D.intel) || part(D.intel)) notes.push(["Deficiência intelectual ou de aprendizagem", "O DSM-5-TR pede para registrar se o autismo vem com ou sem deficiência intelectual e com ou sem prejuízo de linguagem. Uma avaliação neuropsicológica completa esclarece isso."]);
    difBlock = `
    <section class="stack">
      <h2>Diferenciais e condições associadas</h2>
      ${notes.length ? notes.map(([t, x]) => `<article class="result"><h3>${t}</h3><p>${x}</p></article>`).join("") : `<p>Você não indicou sinais fortes das principais condições que imitam o autismo. Isso aumenta a especificidade do resultado acima.</p>`}
    </section>`;
  }

  app.innerHTML = `
    <header class="top">
      <span class="eyebrow">Resultado · ${SECTIONS.length - missing.length} de ${SECTIONS.length} etapas</span>
      <h1>Seu perfil</h1>
      <div class="row"><button class="btn ghost sm" id="home">Voltar ao início</button></div>
    </header>
    <div class="stack-lg">
      ${verdict}
      ${warnings.length ? `<div class="notice">${warnings.map(w => `<p class="small">${w}</p>`).join("")}</div>` : ""}
      ${(aqBlock || raadsBlock) ? `<section class="stack"><h2>Questionários validados</h2>${aqBlock}${raadsBlock}</section>` : ""}
      ${dsmBlock ? `<section class="stack"><h2>Critérios oficiais</h2>${dsmBlock}</section>` : ""}
      ${camufBlock ? `<section class="stack"><h2>Camuflagem</h2>${camufBlock}</section>` : ""}
      ${supportBlock}
      ${difBlock}
      <section class="block">
        <h2>Próximos passos</h2>
        <ul>
          <li><strong>Quem faz o diagnóstico:</strong> psiquiatra ou neurologista, idealmente com avaliação neuropsicológica. Procure profissionais com experiência em autismo em adultos, e em mulheres, se for o caso.</li>
          <li><strong>Pelo SUS:</strong> comece pela Unidade Básica de Saúde (UBS). O encaminhamento pode ser para CAPS, ambulatório de psiquiatria ou CER (Centro Especializado em Reabilitação).</li>
          <li><strong>O que levar:</strong> este resumo, lembranças da infância, boletins ou relatórios escolares antigos, e se possível um familiar que conviveu com você quando criança.</li>
          <li><strong>O que a avaliação costuma incluir:</strong> entrevista do desenvolvimento (como a ADI-R), observação estruturada (como o ADOS-2), escalas de funcionamento e investigação de TDAH, ansiedade, depressão e deficiência intelectual.</li>
          <li><strong>Direitos no Brasil:</strong> a Lei 12.764/2012 (Lei Berenice Piana) reconhece a pessoa autista como pessoa com deficiência para todos os efeitos legais. A Carteira de Identificação da Pessoa com TEA (CIPTEA, Lei 13.977/2020) é emitida pelos estados e municípios. O laudo usa o código 6A02 da CID-11 (ou F84.0 da CID-10).</li>
        </ul>
        <label for="summaryText" class="eyebrow">Resumo para levar à consulta</label>
        <textarea id="summaryText" readonly>${esc(buildSummary(R, O))}</textarea>
        <div class="row">
          <button class="btn sm" id="copy">Copiar resumo</button>
          <span class="muted small" id="copyMsg" aria-live="polite"></span>
        </div>
        <div class="row">
          <button class="btn ghost sm" id="reset">Apagar todas as respostas</button>
          <span id="resetConfirm" hidden><button class="btn sm" id="resetYes">Confirmar: apagar</button></span>
        </div>
      </section>
      ${renderSources()}
    </div>`;
  app.querySelector("#home").onclick = () => go("home");
  app.querySelector("#copy").onclick = () => {
    const ta = app.querySelector("#summaryText"), msg = app.querySelector("#copyMsg");
    const fallback = () => { ta.focus(); ta.select(); msg.textContent = "Texto selecionado. Use Ctrl+C (ou Copiar) para copiar."; };
    try { navigator.clipboard.writeText(ta.value).then(() => msg.textContent = "Resumo copiado.", fallback); } catch (e) { fallback(); }
  };
  app.querySelector("#reset").onclick = () => { app.querySelector("#resetConfirm").hidden = false; };
  app.querySelector("#resetYes").onclick = () => { state.answers = {}; save(); go("home"); };
}

function buildSummary(R, O) {
  const L = ["Avaliação de Traços Autistas: resumo (não é diagnóstico)", "", `Resultado geral: ${O.cat.label} (${O.pts}/7 pontos de evidência)`];
  if (R.aq50) L.push(`AQ-50: ${R.aq50.total}/50 (cortes 26 e 32). Subescalas: ${Object.entries(R.aq50.subs).map(([k, v]) => `${k} ${v}`).join(", ")}`);
  if (R.raads14) L.push(`RAADS-14: ${R.raads14.total}/42 (corte 14); ${R.raads14.child}/13 itens presentes na infância`);
  if (R.dsm) {
    L.push(`DSM-5-TR (checklist): A ${R.dsm.aPresent}/3, B ${R.dsm.bPresent}/4 presentes; início na infância: ${["sim", "provável", "não sabe", "não"][R.dsm.onset]}`);
    L.push("  " + Object.keys(CRITERIA).map(c => `${c} ${STATUS[R.dsm.crit[c].status][0].toLowerCase()}`).join("; "));
  }
  if (R.camuf) L.push(`Camuflagem: ${R.camuf.total}/32 (${R.camuf.level === "alert" ? "alta" : R.camuf.level === "warn" ? "moderada" : "baixa"})`);
  if (R.suporte) L.push(`Suporte indicativo: comunicação social ${LEVEL_NAME[R.suporte.social].toLowerCase()}; comportamentos restritos ${LEVEL_NAME[R.suporte.restricted].toLowerCase()}; crises: ${["nunca/quase nunca", "algumas vezes por ano", "algumas vezes por mês", "semanais ou mais"][R.suporte.crises]}`);
  if (R.dif) {
    const names = { tdah: "TDAH", socanx: "ansiedade social", trauma: "trauma", toc: "TOC", dep: "depressão", intel: "deficiência intelectual/aprendizagem" };
    const flagged = Object.entries(R.dif).filter(([, v]) => v <= 1).map(([k, v]) => `${names[k]}${v === 1 ? " (em parte)" : ""}`);
    L.push(`Diferenciais a investigar: ${flagged.length ? flagged.join(", ") : "nenhum indicado"}`);
  }
  return L.join("\n");
}

function renderSources() {
  return `<section class="block sources">
    <h2>Fontes científicas</h2>
    <p class="muted small">Traduções adaptadas para o português do Brasil a partir das versões originais. As etapas de critérios do DSM-5-TR, camuflagem, suporte e diferenciais foram construídas a partir das definições oficiais e da literatura, mas não são instrumentos validados.</p>
    <ol>
      <li>Baron-Cohen S, Wheelwright S, Skinner R, Martin J, Clubley E. The Autism-Spectrum Quotient (AQ): evidence from Asperger syndrome/high-functioning autism, males and females, scientists and mathematicians. <em>J Autism Dev Disord</em>. 2001;31(1):5–17. (AQ-50, cortes e médias)</li>
      <li>Woodbury-Smith MR, Robinson J, Wheelwright S, Baron-Cohen S. Screening adults for Asperger syndrome using the AQ: a preliminary study of its diagnostic validity in clinical practice. <em>J Autism Dev Disord</em>. 2005;35(3):331–335. (corte clínico 26)</li>
      <li>Ruzich E, Allison C, Smith P et al. <a href="https://link.springer.com/article/10.1186/2040-2392-6-2" target="_blank" rel="noopener">Measuring autistic traits in the general population: a systematic review of the AQ</a>. <em>Molecular Autism</em>. 2015;6:2.</li>
      <li><a href="https://repositorio.ufmg.br/bitstream/1843/60582/2/The%20Autism%20Spectrum%20Quotient%20in%20a%20sample%20of%20Brazilian%20adults%20analyses%20of%20normative%20data%20and%20performance%20pdfa.pdf" target="_blank" rel="noopener">The Autism Spectrum Quotient in a sample of Brazilian adults: analyses of normative data and performance</a>. UFMG. (AQ em adultos brasileiros)</li>
      <li>Eriksson JM, Andersen LMJ, Bejerot S. RAADS-14 Screen: validity of a screening tool for autism spectrum disorder in an adult psychiatric population. <em>Molecular Autism</em>. 2013;4:49. <a href="https://doi.org/10.1186/2040-2392-4-49" target="_blank" rel="noopener">doi:10.1186/2040-2392-4-49</a></li>
      <li>Hull L, Mandy W, Lai MC et al. Development and validation of the Camouflaging Autistic Traits Questionnaire (CAT-Q). <em>J Autism Dev Disord</em>. 2019;49:819–833. (base conceitual da etapa de camuflagem)</li>
      <li>American Psychiatric Association. <em>DSM-5-TR: Manual Diagnóstico e Estatístico de Transtornos Mentais</em>, 5ª ed., texto revisado. 2022/2023. (critérios A–E e níveis de suporte)</li>
      <li>Organização Mundial da Saúde. CID-11, código 6A02: Transtorno do espectro do autismo.</li>
      <li>NICE. <a href="https://www.nice.org.uk/guidance/cg142" target="_blank" rel="noopener">Autism spectrum disorder in adults: diagnosis and management (CG142)</a>.</li>
      <li>Brasil. Lei nº 12.764/2012 (Política Nacional de Proteção dos Direitos da Pessoa com TEA) e Lei nº 13.977/2020 (CIPTEA).</li>
    </ol>
  </section>`;
}

function render() {
  if (state.view === "quiz") renderQuiz();
  else if (state.view === "results") renderResults();
  else renderHome();
}

window.__autismo = { SECTIONS, scoreAQ, scoreRAADS, scoreDSM, scoreSupport, overall };
render();
</script>
